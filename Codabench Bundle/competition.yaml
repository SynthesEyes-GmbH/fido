tasks:
  - index: 0
    name: Task 1 – Surgical Instrument Keypoints Spatial Localisation
    description: Detect surgical tool keypoints in fundus images and estimate tool–tissue distance, leveraging both fundus and iOCT data. Evaluated using AUC of Euclidean distance error, including modality-ablation test cases.
    input_data: input_data.zip
    reference_data: reference_data.zip
    ingestion_program: ingestion_program_keypoints.zip
    scoring_program: scoring_program_keypoints.zip
  - index: 1
    name: Task 2 – Intraoperative iOCT to Fundus Registration
    description: Estimate the rigid 3D-to-2D transformation that aligns a volumetric iOCT scan to the corresponding fundus microscope image. Evaluated using AUC of corner error under real-time inference constraints.
    input_data: input_data.zip
    reference_data: reference_data.zip
    ingestion_program: ingestion_program_registration.zip
    scoring_program: scoring_program_registration.zip


