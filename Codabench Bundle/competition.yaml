version: 2
title: Fusion for Intelligent Decision-support in Ophthalmology (FIDO) Challenge
description: The FIDO Challenge focuses on multimodal AI-driven decision-support
  for ophthalmic surgery, combining surgical microscope fundus imaging fand
  intraoperative OCT (iOCT).
image: logo.jpg
terms: terms.md
registration_auto_approve: false
docker_image: pytorch/pytorch:2.7.0-cuda12.8-cudnn9-runtime
queue: ...

