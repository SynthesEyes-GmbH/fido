  - title: Task 2
    file: task2.md
  - title: Data
    file: data.md
  - title: Terms
    file: terms.md
  - title: Event Schedule
    file: event.md
  - title: Organizers
    file: orga.md

phases:
  - index: 0
    name: Practice
    description: Test phase
    start: 2026-06-01
    end: 2026-06-30
    max_submissions_per_day: 0
    execution_time_limit: 1800
    tasks:
      - 0
      - 1

  - index: 1
    name: Competition
    description: Competition phase
    start: 2026-07-01
    end: 2026-08-30
    max_submissions_per_day: 3
    execution_time_limit: 1800
    tasks:
